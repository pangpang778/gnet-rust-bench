[package]
name = "gnet"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "High-performance, lightweight, non-blocking event-driven network framework"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "rt-multi-thread", "macros"] }
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
